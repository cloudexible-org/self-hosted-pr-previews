name: Preview

# One private preview per pull request on the shared preview host, at
# https://pr-<number>.<PREVIEW_DOMAIN>, with its own backend preview. A daily run
# removes previews whose pull request closed without a teardown, and is the
# heartbeat preview-health.yml watches.
#
# Reference template — copy to `.github/workflows/preview.yml` in the project and
# fill the `env` block from config.yaml (projects[]). The Doppler and Convex parts
# are marked; replace or delete them to match projects[].secrets and
# projects[].backend. docs/07-project-workflow.md explains every step.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# A newer push supersedes a build still in flight; closing the PR cancels one.
concurrency:
  group: preview-${{ github.event.pull_request.number || 'cleanup' }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  # projects[].name — container, router and service names are global on the
  # shared host, so every one of them carries this prefix.
  PROJECT: myapp
  # projects[].preview_domain
  PREVIEW_DOMAIN: preview.myapp.com
  # projects[].app
  DOCKERFILE: apps/web/Dockerfile
  APP_PORT: "3000"
  APP_MEMORY: 1g
  APP_CPUS: "1"
  PR: ${{ github.event.pull_request.number }}

jobs:
  deploy:
    name: deploy preview
    # Same-repository PRs only: code from a fork must never reach a self-hosted
    # runner. Dependabot runs get no environment secrets, so they could only fail.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on:
      # github.runners[].runner_group — or `labels` alone for a repo-level runner.
      group: previews
      # `linux` keeps a Windows runner added to the group from taking bash steps.
      labels: [self-hosted, linux]
    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}.${{ env.PREVIEW_DOMAIN }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # Per job, not ~/setup-pnpm: two runners under one user would race on it.
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── secrets.manager: doppler ──────────────────────────────────────────
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      # ── backend.kind: convex ──────────────────────────────────────────────
      # `convex deploy` claims (or reuses) the PR's backend preview, runs `--cmd`
      # with its URL in PUBLIC_BACKEND_URL (projects[].backend.url_env_var), then
      # pushes the functions — so a failed image build never pushes. The seed runs
      # only when this deploy *created* the preview.
      #
      # The image is labelled with that URL: teardown needs the deployment's name
      # to delete it, and a preview deploy key cannot look one up by PR number.
      #
      # Without a backend, replace this step with a plain `docker build` carrying
      # the same tag.
      - name: Deploy the backend preview and build the image
        working-directory: packages/backend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_BACKEND }}
        run: |
          # --cmd is single-quoted on purpose: convex deploy expands it, after
          # setting PUBLIC_BACKEND_URL.
          # shellcheck disable=SC2016
          doppler run -- npx convex deploy \
            --preview-name "pr-$PR" \
            --preview-run seed/preview:apply \
            --cmd-url-env-var-name PUBLIC_BACKEND_URL \
            --cmd 'docker build --file "$GITHUB_WORKSPACE/$DOCKERFILE" --tag "$PROJECT-preview:pr-$PR" --label preview.convex-url="$PUBLIC_BACKEND_URL" --build-arg PUBLIC_BACKEND_URL --build-arg PUBLIC_APP_URL="https://pr-$PR.$PREVIEW_DOMAIN" "$GITHUB_WORKSPACE"'

      # Every variable in the web app's Doppler `preview` config reaches the
      # container, minus Doppler's own DOPPLER_* metadata. Downloading into a
      # variable first makes a bad token fail the step instead of starting a
      # container with no secrets. Branch names are untrusted input, so they
      # arrive through env, never inline.
      #
      # The limits keep one preview from starving the host, which other previews,
      # builds and — on a desktop — you share. A preview short of memory shows up
      # as a restarting container (`OOMKilled` in `docker inspect`).
      - name: Start the preview container
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_WEB }}
          BRANCH: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          NAME="$PROJECT-pr-$PR"
          web_env="$(doppler secrets download --no-file --format docker)"
          docker rm --force "$NAME" 2>/dev/null || true
          docker run --detach \
            --name "$NAME" \
            --network previews \
            --restart unless-stopped \
            --memory "$APP_MEMORY" \
            --cpus "$APP_CPUS" \
            --pids-limit 1024 \
            --env-file <(grep -v '^DOPPLER_' <<<"$web_env") \
            --label traefik.enable=true \
            --label "traefik.http.routers.$NAME.rule=Host(\`pr-$PR.$PREVIEW_DOMAIN\`)" \
            --label "traefik.http.routers.$NAME.entrypoints=websecure" \
            --label "traefik.http.routers.$NAME.tls.certresolver=acme" \
            --label "traefik.http.routers.$NAME.tls.domains[0].main=*.$PREVIEW_DOMAIN" \
            --label "traefik.http.services.$NAME.loadbalancer.server.port=$APP_PORT" \
            --label "preview.project=$PROJECT" \
            --label "preview.pr=$PR" \
            --label "preview.repo=$GITHUB_REPOSITORY" \
            --label "preview.branch=$BRANCH" \
            --label "preview.sha=$SHA" \
            --label "preview.run-url=$RUN_URL" \
            "$PROJECT-preview:pr-$PR"
          # Drop the previous build of this PR, now untagged.
          docker image prune --force

  # A preview outlives its pull request when teardown never ran — typically
  # because the host was down when the PR closed, and GitHub drops a job still
  # queued after 24 hours. Once a day this lists the pull requests that have an
  # image or container on the host but are no longer open.
  stale:
    name: find stale previews
    if: github.event_name != 'pull_request'
    runs-on:
      group: previews
      labels: [self-hosted, linux]
    permissions:
      pull-requests: read
    outputs:
      prs: ${{ steps.find.outputs.prs }}
    steps:
      - name: Compare previews on the host with open pull requests
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One page of open PRs; raise it, or paginate, past 100.
          open="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" | jq -c 'map(.number)')"
          here="$( {
            docker image ls "$PROJECT-preview" --format '{{.Tag}}' | sed -n 's/^pr-\([0-9][0-9]*\)$/\1/p'
            docker ps --all --filter "label=preview.project=$PROJECT" --format '{{.Label "preview.pr"}}'
          } | { grep -E '^[0-9]+$' || true; } | jq -sc 'unique')"
          prs="$(jq -nc --argjson here "$here" --argjson open "$open" '$here - $open')"
          echo "On the host: $here. Open: $open. Stale: $prs."
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

  # For the closed pull request, or for each stale one the daily run found.
  teardown:
    name: remove preview
    needs: stale
    if: >-
      !cancelled() && (
        (github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository) ||
        (needs.stale.result == 'success' && needs.stale.outputs.prs != '[]')
      )
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(github.event_name == 'pull_request' && format('[{0}]', github.event.pull_request.number) || needs.stale.outputs.prs || '[0]') }}
    runs-on:
      group: previews
      labels: [self-hosted, linux]
    # For the Doppler token that reads the backend's preview deploy key.
    environment:
      name: preview
    env:
      PR: ${{ matrix.pr }}
    steps:
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      # The image goes last: if deleting the backend preview fails, the image
      # survives with its label, and re-running this job — or the next daily run —
      # retries. An image built without the label leaves its backend preview to
      # the provider's expiry.
      - name: Remove the container, the backend preview and the image
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_BACKEND }}
        run: |
          NAME="$PROJECT-pr-$PR"
          IMAGE="$PROJECT-preview:pr-$PR"
          url="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "preview.convex-url" }}' 2>/dev/null || true)"
          docker rm --force "$NAME" 2>/dev/null || true

          # ── backend.kind: convex ──────────────────────────────────────────
          host="${url#https://}"
          name="${host%%.convex.cloud*}"
          if [ -z "$url" ] || [ "$name" = "$host" ]; then
            echo "No backend URL on the image; leaving the preview deployment to expire."
          else
            key="$(doppler secrets get CONVEX_DEPLOY_KEY --plain)"
            echo "::add-mask::$key"
            api="https://api.convex.dev/v1/deployments/$name"
            # Read-only first, so a key the API refuses fails before any delete.
            # A deployment that is already gone (expired, or deleted by hand)
            # needs nothing more.
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $key" "$api")"
            case "$status" in
              200)
                curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $key" "$api/delete"
                echo
                echo "Deleted backend preview $name."
                ;;
              404)
                echo "Backend preview $name is already gone."
                ;;
              *)
                echo "::error::The Convex API answered $status for deployment $name."
                exit 1
                ;;
            esac
          fi

          docker image rm "$IMAGE" 2>/dev/null || true
