# /etc/wsl.conf in the preview host's own distro (host.kind: wsl2).
# Takes effect after `wsl --terminate <distro>`.

[boot]
# The GitHub runner, Docker and tailscaled all run as systemd services.
systemd=true

[automount]
# Jobs run pull-request code. Without Windows drives mounted, neither a job nor
# a container holding the Docker socket can read the Windows user's files.
enabled=false
mountFsTab=false

[interop]
# Likewise: no launching Windows programs from inside the distro.
enabled=false
appendWindowsPath=false

[user]
# host.user
default=runner
